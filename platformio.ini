[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

# Default Build settings
# Assuming source code is directly in the root for now, adjust if needed
build_src_filter = +<*> -<tools/> -<test/> -<html/>

# Upload settings
upload_speed = 921600
# upload_port = /dev/cu.usbserial-XXXX # Replace XXXX with your port

# Filesystem build/upload
# Use a partition scheme with LittleFS. 'default_littlefs' allocates ~1.5MB
board_build.partitions = partitions.csv # Use custom partition table
board_build.filesystem = littlefs

# Library options
lib_deps =
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    ottowinter/ESPAsyncWebServer-esphome @ ^3.1.0
    bblanchon/ArduinoJson @ ^7.0.4
    ; No specific library dependencies for this basic example

# PlatformIO Core Configuration
[platformio]
description = ESP32 Oscilloscope with Web UI
src_dir = . # Source files in root
include_dir = . # Include files in root
data_dir = html # Files for LittleFS image

# Standard target to build and upload filesystem image
# Usage: pio run --target uploadfs

# Note: Ensure 'html' directory contains the web files 
# in the correct structure (e.g., html/var/www/html/oscilloscope.html)

# Custom targets for convenience
[env:uploadfs]
platform = espressif32
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
upload_tool = esptoolpy
upload_flags =
    --chip esp32 
    --port ${env:esp32dev.upload_port} 
    --baud ${env:esp32dev.upload_speed} 
    write_flash 
    --flash_size detect 
    0x290000 .pio/build/esp32dev/littlefs.bin 